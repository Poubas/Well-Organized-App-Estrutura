<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="public\assets" type="image/x-icon">
    <link rel="stylesheet" href="public\css\style.css">
    <title>TodoApp</title>
</head>
<body>
    <header id="navBar">
        <img src="public/assets/well-organized-logo.png" alt="">
        <a href="#principal">A fazer</a>
        <p> | </p>
        <a href="#Arquivadas">Arquivadas</a>
    </header>

    <main>

            <div id="divAddBtn">
                <button onclick="abrirMenu(this)" class="botaoAdicionarTarefa">Adicionar Tarefa</button>
                <ul id="tarefas"></ul>
            </div>
        -->

        <form id="menu">
            <p class="textoDescricao">Descrição</p>
            <input type="text" class="inputDescricao">
            <p class="textoCor">Cor</p>

            <input type="radio" name="cor" class="radioCor" id="radioAzul" value="azul">
            <input type="radio" name="cor" class="radioCor" id="radioVerde" value="azul">
            <input type="radio" name="cor" class="radioCor" id="radioRosa" value="azul">
            <input type="radio" name="cor" class="radioCor" id="radioRoxo" value="azul">
            <input type="radio" name="cor" class="radioCor" id="radioAmarelo" value="azul">
            <input type="radio" name="cor" class="radioCor" id="radioLaranja" value="azul">
            <input type="radio" name="cor" class="radioCor" id="radioBranco" value="azul">

            <button type="submit">Adicionar</button>
        </form>
        
        
        <div id="tasks">
            <ul id="tasksList"></ul>
        </div>
    </main>
    <script src="./public/js/script.js"></script>
