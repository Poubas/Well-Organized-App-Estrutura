<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="public\assets" type="image/x-icon">
    <link rel="stylesheet" href="public\css\style.css">
    <title>TodoApp</title>
</head>

<body>
    <header id="navBar">
        <img src="public/assets/well-organized-logo.png" alt="">
        <div >
            <a href="index.html" class="headerLink">A fazer</a>
            <p> | </p>
            <a href="Arquivadas.html" class="headerLinks">Arquivadas</a>
        </div>
    </header>

    <main id="main">

        <div id="divAddBtn" hidden>
            <button onclick="abrirMenu(this)" class="botaoAdicionarTarefa">Adicionar Tarefa</button>
            <ul id="tarefas"></ul>
        </div>

         <div id="taskInput"`>

            <label for="inputDescrição">Descrição</label>
            <input type="text" id="inputDescricao" name="descricao">

            <input type="radio" name="cor" class="radioCor" id="radioAzul" value="#daf5fa">
            <input type="radio" name="cor" class="radioCor" id="radioVerde" value="#d1fecb">
            <input type="radio" name="cor" class="radioCor" id="radioRosa" value="#f6d0f6">
            <input type="radio" name="cor" class="radioCor" id="radioRoxo" value="#dcd0f3">
            <input type="radio" name="cor" class="radioCor" id="radioAmarelo" value="#fcfccb">
            <input type="radio" name="cor" class="radioCor" id="radioLaranja" value="#fbd4b4">
            <input type="radio" name="cor" class="radioCor" id="radioBranco" value="#ffff">

            <button id="btnAdicionar">Adicionar</button>
         </div>

         <div id="todo">
            <ul id="todo-tasks" class="ulTasks"></ul>
        </div>
        <div id="done">
            <h3>Done</h3>
            <ul id="done-tasks"></ul>
        </div>
    </main>
    
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="./public/js/script.js"></script>

</body>

</html>
